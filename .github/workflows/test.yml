name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-hub
    steps:
      # The crate path-depends on the sibling repositories
      # (../unidpp-core, ../unidpp-signatif); check them out side by
      # side, mirroring the family layout the manifests assume.
      - uses: actions/checkout@v4
        with:
          path: unidpp-hub
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
